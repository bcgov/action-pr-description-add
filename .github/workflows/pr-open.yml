name: PR
on:
  pull_request:

jobs:
  test:
    name: Test Action
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      # Rebuild ./dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - name: Rebuild the dist/ directory
        run: npm run dist 
     
     # Test action
      - uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_markdown: |
            ---

            # Things!
            ## Excitement!
            [Links!](https://google.ca)
            `Code!`

      # Test with different inputs
      - uses: ./
        with:
          add_markdown: |
            ---

            # Things!
            ## Excitement!
            [Links!](https://google.ca)
            `Code!`

      # Test checkbox handling - should not duplicate when checkbox state changes
      # This tests that checkboxes with same content don't cause false positive duplicates
      - uses: ./
        with:
          add_markdown: |
            ## Checkbox Test
            - [ ] Unchecked item
            - [x] Checked item

      # Verify checkbox content is not duplicated when run again
      - uses: ./
        with:
          add_markdown: |
            ## Checkbox Test
            - [ ] Unchecked item
            - [x] Checked item
