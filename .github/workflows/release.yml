name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build dist and publish release
    # skip bot-made releases so automation never re-enters itself
    if: github.actor != 'github-actions[bot]' && github.event.release.author.login != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check tags and cut -src
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${TAG} is not vX.Y.Z" >&2
            exit 1
          fi
          src="${TAG}-src"
          # loop guard: release already points at a dist rebuild
          if git log -1 --format=%s HEAD | grep -q '^chore(dist): build ncc bundle'; then
            echo "${TAG} already has dist; skipping" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${src}" > /dev/null; then
            echo "${src} already exists" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "${TAG} is not on the main tip" >&2
            exit 1
          fi
          # notes compare -src to -src: newest earlier -src tag
          previous=""
          for t in $(git tag -l 'v*-src' --sort=-v:refname); do
            v="${t%-src}"
            older=$(printf '%s\n%s\n' "$v" "$TAG" | sort -V | head -n 1)
            if [ "$v" != "$TAG" ] && [ "$older" = "$v" ]; then
              previous="$t"
              break
            fi
          done
          if [ -z "$previous" ]; then
            # first double-tag release: start from the last other vX.Y.Z tag
            previous=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx -- "$TAG" | head -n 1 || true)
          fi
          if [ -z "$previous" ]; then
            echo "no previous release tag found" >&2
            exit 1
          fi
          # permanent marker for the main commit this release was built from
          git tag "$src" HEAD
          git push origin "refs/tags/${src}"
          echo "src=${src}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tags.outputs.skip != 'true'
        with:
          node-version: 24.x
          cache: npm

      - name: Build dist on a side commit and move the release tags to it
        if: steps.tags.outputs.skip != 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run package
          if [ ! -f dist/index.js ]; then
            echo "dist/index.js is missing after the build" >&2
            exit 1
          fi
          # dist/ is git-ignored on main; it only lives on this side commit
          git add -f -- dist
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore(dist): build ncc bundle for ${TAG}"
          # move vX.Y.Z and the floating major tag (vX) onto the dist commit
          major="${TAG%%.*}"
          git tag -f "$TAG"
          git tag -f "$major"
          git push -f origin "refs/tags/${TAG}" "refs/tags/${major}"

      - name: Regenerate release notes (-src to -src)
        if: steps.tags.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          SRC: ${{ steps.tags.outputs.src }}
          PREVIOUS: ${{ steps.tags.outputs.previous }}
        run: |
          set -euo pipefail
          notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$SRC" -f previous_tag_name="$PREVIOUS" --jq .body)
          gh release edit "$TAG" --notes "$notes"
